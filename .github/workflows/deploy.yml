name: Portfolio CI/CD

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 --decode > ~/.ssh/portfolio.pem
          chmod 600 ~/.ssh/portfolio.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/portfolio.pem ubuntu@${{ secrets.EC2_HOST }} \
            "rm -rf /var/www/portfolio/*"

          scp -i ~/.ssh/portfolio.pem -r dist/* \
            ubuntu@${{ secrets.EC2_HOST }}:/var/www/portfolio/

      - name: Verify Deployment
        run: |
          ssh -i ~/.ssh/portfolio.pem ubuntu@${{ secrets.EC2_HOST }} \
            "ls -la /var/www/portfolio"